# The user selected Render Free; configure the backend secret in Render before deployment.
services:
  - type: web
    name: opengym-cloud
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: off
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        value: https://gqfurtopojqrokdhciqz.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_INSTANCE
        value: main
      - key: DATA_BACKEND
        value: supabase
      - key: COACH_DISABLED
        value: "1"
      - key: DEFAULT_LANG
        value: zh-CN
      - key: PASSWORD_LOGIN
        value: "1"
      - key: ALLOW_GUEST
        value: "0"
      - key: INVITE_ONLY
        value: "0"
